<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Santísimo Oraciones | Videos frente al Santísimo</title>
    <meta name="description" content="Oraciones y videos frente al Santísimo Sacramento del Altar. Entra para contemplar y orar.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f5e9d3;
            padding: 20px;
            text-align: center;
            background-image:
                radial-gradient(ellipse at center top, rgba(80, 40, 120, 0.35) 0%, transparent 60%),
                radial-gradient(ellipse at center bottom, rgba(30, 10, 60, 0.5) 0%, transparent 60%),
                linear-gradient(180deg, #0d0d15 0%, #1a0f2a 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-cruz {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.7)); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #ffd966;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .subtitulo {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #d4c5b0;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .subtitulo em {
            color: #f0d080;
            font-style: normal;
        }

        .boton-principal {
            display: inline-block;
            background: linear-gradient(145deg, #ffb347, #e6a020);
            color: #1a0f00;
            font-size: 1.6rem;
            font-weight: 800;
            text-decoration: none;
            padding: 20px 48px;
            border-radius: 60px;
            border: 3px solid #ffd966;
            box-shadow:
                0 0 25px rgba(255, 180, 50, 0.7),
                0 8px 0 #a06a10,
                0 12px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .boton-principal::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 40%,
                rgba(255, 255, 255, 0.4) 50%,
                transparent 60%
            );
            animation: brillo 2.5s infinite linear;
            pointer-events: none;
        }

        @keyframes brillo {
            0% { transform: translateX(-100%) rotate(0deg); }
            100% { transform: translateX(100%) rotate(0deg); }
        }

        .boton-principal:active {
            transform: translateY(6px);
            box-shadow:
                0 0 20px rgba(255, 180, 50, 0.6),
                0 2px 0 #a06a10,
                0 6px 15px rgba(0, 0, 0, 0.5);
        }

        .boton-principal .icono-btn {
            font-size: 1.8rem;
            margin-right: 10px;
            vertical-align: middle;
        }

        .frase-final {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #9a8a7a;
            font-style: italic;
        }

        .frase-final span {
            color: #d4b060;
        }

        @media (max-width: 380px) {
            h1 { font-size: 1.8rem; }
            .boton-principal {
                font-size: 1.3rem;
                padding: 16px 30px;
            }
            .boton-principal .icono-btn {
                font-size: 1.5rem;
            }
            .icon-cruz { font-size: 52px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-cruz">✝️</div>
        <h1>El Santísimo Oraciones</h1>
        <p class="subtitulo">
            Bienvenido. Aquí encontrarás <em>oraciones y videos</em> frente al
            <em>Santísimo Sacramento del Altar</em>.<br>
            Prepara tu corazón para la adoración.
        </p>

        <a href="https://el-santisimo-oraciones.vercel.app/?id=22" class="boton-principal">
            <span class="icono-btn">▶</span> VER VIDEOS
        </a>

        <p class="frase-final">
            «Señor mío y Dios mío» <span>— Juan 20:28</span>
        </p>
    </div>

    <!-- Script mínimo para precargar el enlace (opcional, mejora UX sin consumir recursos) -->
    <script>
        // Prefetch del destino al pasar el dedo o al cargar (muy ligero)
        const link = document.querySelector('.boton-principal');
        if (link) {
            link.addEventListener('touchstart', () => {
                const prefetch = document.createElement('link');
                prefetch.rel = 'prefetch';
                prefetch.href = link.href;
                document.head.appendChild(prefetch);
            }, { passive: true });
        }
    </script>
</body>
</html>
